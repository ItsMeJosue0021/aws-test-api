; PHP-FPM overrides for test-api uploads.
;
; Install to: /etc/php/8.5/fpm/conf.d/99-test-api.ini
; See deploy/README.md. Requires `sudo systemctl restart php8.5-fpm`.
;
; Ubuntu's php8.5-fpm ships upload_max_filesize=2M and post_max_size=8M.
; StoreBlogRequest accepts up to 5 images at 5 MB each (~25 MB per request),
; so without these overrides PHP truncates the body BEFORE Laravel validates.
; The failure looks like an empty $_FILES / "images must be an image" rather
; than a clean 413, which makes it genuinely hard to diagnose.
;
; Keep this chain consistent, largest to smallest:
;   nginx client_max_body_size (32M)  >=  post_max_size (32M)  >=  actual 25 MB
;   upload_max_filesize (6M)          >=  Laravel's max:5120 (5 MB per file)

upload_max_filesize = 6M
post_max_size = 32M
max_file_uploads = 20
