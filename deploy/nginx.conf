# nginx server block for test-api.
#
# Install to: /etc/nginx/sites-available/test-api
# See deploy/README.md for the exact commands.
#
# Before enabling, change `server_name` below to your domain.
# Certbot (Step 8) will rewrite this file to add the TLS listener and a
# port-80 -> 443 redirect. That is expected -- don't undo it.

server {
    listen 80;
    listen [::]:80;

    server_name <your-domain.com>;

    # The web root is public/, NOT the project root. Pointing this at
    # /var/www/test-api would serve .env to the internet.
    root /var/www/test-api/public;

    index index.php;
    charset utf-8;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    # Must be >= post_max_size in deploy/php-uploads.ini, or nginx rejects the
    # request with a 413 before PHP ever sees it.
    client_max_body_size 32M;

    # Everything that isn't a real file goes to Laravel's front controller.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.5-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;

        # Long-running API requests. Must be >= PHP's max_execution_time.
        fastcgi_read_timeout 60s;
    }

    # Block dotfiles (.env, .git, ...) but allow ACME challenges so certbot
    # can renew certificates.
    location ~ /\.(?!well-known).* {
        deny all;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Health check endpoint registered in bootstrap/app.php.
    # Not logged, so uptime pings don't fill the access log.
    location = /up {
        access_log off;
        try_files $uri /index.php?$query_string;
    }

    error_page 404 /index.php;

    access_log /var/log/nginx/test-api.access.log;
    error_log  /var/log/nginx/test-api.error.log;
}
